<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CF 竞品活动展示台</title>
<style>


  :root {
    --bg:#0a0c10; --bg2:#0e1016;
    --panel:#171a21; --panel2:#1d212a; --panel3:#222732;
    --ink:#ece8df; --ink2:#c2bfb6; --sub:#8d8a82;
    --line:rgba(255,255,255,.10); --line-soft:rgba(255,255,255,.055); --line-bright:rgba(255,255,255,.20);
    --amber:#e8b820; --amber-text:#f0d430; --amber-soft:rgba(232,184,32,.12);
    --teal:#3fb0a3; --teal-text:#54c3b6;
    --cf:#e0584a; --cfm:#4aa6dd; --cfhd:#a87fe0;
    --mono:"SFMono-Regular","JetBrains Mono",Consolas,"Liberation Mono",Menlo,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    /* V32 · 整页等比缩放系数：由 JS 的 refit() 按视口高度算出并写入。
       1 = 原始尺寸；<1 = 矮屏（2K/1080p）上整体缩小，保证「一屏看全」且与 4K 视觉比例一致。 */
    --fit: 1;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html { scroll-behavior:smooth; }
  body {
    background:
      radial-gradient(900px 460px at 85% -15%, rgba(232,184,32,.10), transparent 60%),
      radial-gradient(820px 460px at -10% 4%, rgba(74,166,221,.07), transparent 55%),
      radial-gradient(760px 460px at 60% 110%, rgba(168,127,224,.06), transparent 55%),
      linear-gradient(180deg,var(--bg),var(--bg2));
    background-attachment:fixed;
    color:var(--ink); font-family:var(--sans);
    padding:40px 24px 90px; line-height:1.6; min-height:100vh; font-size:14px;
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
    -webkit-user-select:none; user-select:none;
  }
  /* 表单控件：允许选中 + 保留光标（便于在搜索框/日期框输入） */
  input, select, textarea, [contenteditable=true] { -webkit-user-select:text; user-select:text; }
  /* 展开后的活动卡片内容：可选中/拖选复制，但隐藏单击产生的闪烁文本光标（caret-color:transparent 不影响拖选与复制） */
  .hcard.active, .hcard.hot, .tl-node.open, .entry.open,
  .hcard.active *, .hcard.hot *, .tl-node.open *, .entry.open * {
    -webkit-user-select:text; user-select:text; caret-color:transparent;
  }
  /* V32 · 整页等比缩放：矮屏（2K 的 ~1300px / 1080p 的 ~940px 可视高）装不下 1179px 的自然高度时，
     整体缩小而不是让页面滚动。body 的 padding(40+90) 在 .wrap 之外、不参与缩放，
     所以 refit() 里预留固定 132px（40+90 的 padding + 2px 亚像素余量）。
     缩放不作用于 .lb-overlay / 背景层 / 水印（都在 .wrap 之外），
     它们保持满屏，不受影响。 */
  .wrap { max-width:none; margin:0; position:relative; z-index:1; zoom: var(--fit); }

  /* ===== HERO ===== */
  .hero {
    position:relative; background:
      linear-gradient(180deg,rgba(255,255,255,.025),rgba(255,255,255,0)),
      var(--panel);
    border:1px solid var(--line); border-radius:6px;
    padding:38px 40px 34px; margin-bottom:30px; overflow:hidden;
  }
  .hero::before {
    content:""; position:absolute; top:0; left:0; right:0; height:2px;
    background:linear-gradient(90deg,var(--amber) 0 100%);
  }
  .hero-bracket { position:absolute; width:14px; height:14px; border:1px solid var(--amber); pointer-events:none; opacity:.5; }
  .hero-bracket.tl { top:12px; left:12px; border-right:none; border-bottom:none; }
  .hero-bracket.tr { top:12px; right:12px; border-left:none; border-bottom:none; }
  .hero-bracket.bl { bottom:12px; left:12px; border-right:none; border-top:none; }
  .hero-bracket.br { bottom:12px; right:12px; border-left:none; border-top:none; }
  .hero-grid { display:flex; gap:40px; align-items:center; flex-wrap:wrap; }
  .hero-left { flex:1; min-width:300px; }
  .hero-kicker { font-family:var(--mono); font-size:11px; letter-spacing:3px; text-transform:uppercase; color:var(--amber-text); margin-bottom:16px; font-weight:600; }
  .hero-title { font-family:var(--sans); font-size:44px; font-weight:800; line-height:1.12; letter-spacing:.5px; color:var(--ink); }
  .hero-title span { font-size:24px; color:var(--ink2); font-weight:700; }
  .hero-sub { margin-top:16px; font-size:14px; color:var(--sub); line-height:1.8; max-width:520px; }
  .hero-meta { margin-top:20px; display:flex; gap:20px; align-items:center; flex-wrap:wrap; font-family:var(--mono); font-size:11.5px; color:var(--sub); }
  .hero-meta a { color:var(--amber-text); text-decoration:none; border-bottom:1px solid rgba(233,162,59,.4); }
  .hero-meta a:hover { color:#fff; }
  /* 注意：此处不能加 overflow:hidden —— ::before 标签在 top:-9px（容器外），会被裁掉上半截 */
  .hero-readout {
    background:var(--panel2); border:1px solid var(--line); border-radius:5px;
    position:relative;
  }
  .hero-readout::before { content:"READOUT // 全量读数"; position:absolute; top:-9px; left:14px; background:var(--panel); padding:0 6px; font-family:var(--mono); font-size:9px; letter-spacing:1.5px; color:var(--sub); z-index:1; }
  .ro-grid { display:grid; grid-template-columns:1fr 1fr; gap:0; }
  .ro { text-align:center; padding:15px 8px 13px; }
  .ro-num { display:block; font-family:var(--mono); font-size:26px; font-weight:700; color:var(--ink); letter-spacing:-.5px; }
  .ro.cf .ro-num { color:var(--cf); }
  .ro.cfm .ro-num { color:var(--cfm); }
  .ro.cfhd .ro-num { color:var(--cfhd); }
  .ro-lbl { display:block; font-family:var(--mono); font-size:10px; letter-spacing:.5px; color:var(--sub); margin-top:6px; }
  /* V29E · 类型构成：标题区内独立面板，四枚饼图横向排开，图例跟在各自饼图下方（竖向）以压缩高度 */
  .type-panel { flex:none; position:relative; padding:20px 14px 13px;
    background:var(--panel2); border:1px solid var(--line); border-radius:5px; }
  .type-panel-t { position:absolute; top:-9px; left:14px; background:var(--panel); padding:0 6px;
    font-family:var(--mono); font-size:10px; letter-spacing:1.5px; color:var(--sub); z-index:1; }
  .donut-row { display:grid; grid-template-columns:repeat(4,auto); gap:0 16px; }
  .dn-cell { text-align:center; }
  .dn-box { width:74px; height:74px; margin:0 auto; }
  .dn { display:block; width:100%; height:100%; }
  .dn-seg { transition:opacity .15s ease; cursor:pointer; }
  .dn-cell:hover .dn-seg { opacity:.35; }
  .dn-seg:hover { opacity:1; }
  /* 圆心数字统一为 --ink：不按端着色，颜色只属于「类别」这一个维度，避免两套配色打架 */
  .dn-num { font-family:var(--mono); font-size:17px; font-weight:700; fill:var(--ink); }
  .dn-cap { font-family:var(--mono); font-size:11px; letter-spacing:.4px; color:var(--sub); margin-top:5px; white-space:nowrap; }
  /* V29I · 数值改为悬停查看：饼图下方不再常驻数值行，类别名由面板底部共享一行给出 */
  .dn-lg { display:inline-flex; align-items:center; gap:4px; font-family:var(--mono); font-size:10.5px; color:var(--ink2); white-space:nowrap; }
  .dn-lg i { width:7px; height:7px; border-radius:1px; display:inline-block; flex:none; }
  .type-legend { margin-top:9px; padding-top:8px; border-top:1px solid var(--line-soft);
    display:flex; gap:5px 14px; justify-content:center; flex-wrap:wrap; }
  .type-legend .dn-lg { color:var(--sub); }
  /* 悬停扇区时，端名临时显示为类别名并提亮 */
  .dn-cap.hover { color:var(--ink); }

  /* ===== 工具条 ===== */
  .toolbar { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:20px;
    padding:12px 14px; background:var(--panel); border:1px solid var(--line); border-radius:5px; }
  .search, select, .date-in {
    background:var(--panel2); border:1px solid var(--line); color:var(--ink); border-radius:3px;
    padding:9px 13px; font-size:13px; outline:none; font-family:var(--mono); transition:.15s;
  }
  .search { flex:1; min-width:210px; }
  .search::placeholder { color:#6f6c64; }
  .search:focus, select:focus, .date-in:focus { border-color:var(--amber); box-shadow:0 0 0 2px var(--amber-soft); }
  select { cursor:pointer; }
  .date-in { color-scheme:dark; }
  .date-sep { color:var(--sub); font-family:var(--mono); font-size:12px; align-self:center; }
  .btn-clear {
    background:var(--panel2); border:1px solid var(--line); color:var(--sub); border-radius:3px;
    padding:8px 12px; font-size:12.5px; cursor:pointer; font-family:var(--mono); transition:.15s;
  }
  .btn-clear:hover { background:var(--amber); color:#1a1408; border-color:var(--amber); }
  .chips { display:flex; gap:8px; flex-wrap:wrap; }
  .chip {
    background:var(--panel2); border:1px solid var(--line); color:var(--sub); border-radius:3px;
    padding:6px 14px; font-size:12.5px; cursor:pointer; user-select:none; font-family:var(--mono); transition:.15s;
  }
  .chip:hover { border-color:var(--amber); color:var(--ink); }
  .chip.active { background:var(--amber); border-color:var(--amber); color:#1a1408; font-weight:700; }
  .result-info { font-family:var(--mono); font-size:12px; color:var(--sub); margin-bottom:20px; letter-spacing:.3px; }
  .result-info::before { content:"▸ "; color:var(--amber); }

  /* ===== 分组区块 ===== */
  .game-group { margin-bottom:40px; }
  .game-group:last-child { margin-bottom:0; }
  .group-banner {
    display:flex; align-items:center; gap:14px; padding:13px 18px; margin-bottom:22px;
    background:linear-gradient(90deg,rgba(255,255,255,.03),rgba(255,255,255,0)),var(--panel);
    border:1px solid var(--line); border-radius:5px; position:relative;
  }
  .group-banner::before { content:""; position:absolute; left:0; top:0; bottom:0; width:4px; border-radius:5px 0 0 5px; background:var(--line-bright); }
  .group-banner.cf::before { background:var(--cf); }
  .group-banner.cfm::before { background:var(--cfm); }
  .group-banner.cfhd::before { background:var(--cfhd); }
  .group-banner.empty::before { background:var(--sub); }
  .gb-tag { font-family:var(--mono); font-size:12px; font-weight:700; color:#15110a; padding:3px 11px; border-radius:3px; background:var(--ink); letter-spacing:1px; }
  .group-banner.cf .gb-tag { background:var(--cf); color:#1a0c09; }
  .group-banner.cfm .gb-tag { background:var(--cfm); color:#06121c; }
  .group-banner.cfhd .gb-tag { background:var(--cfhd); color:#120a1c; }
  .gb-name { font-size:17px; font-weight:800; color:var(--ink); letter-spacing:.5px; }
  .gb-count { margin-left:auto; font-family:var(--mono); font-size:12px; color:var(--sub); letter-spacing:.5px; }
  .gb-num { font-family:var(--mono); font-size:22px; font-weight:700; color:var(--ink); opacity:.32; letter-spacing:1px; margin-right:2px; }

  /* ===== 编辑式条目列表（非卡片） ===== */
  .entries { display:block; }
  .entry { border-top:1px solid var(--line); }
  .entry:last-child { border-bottom:1px solid var(--line); }
  .entry-head { display:flex; align-items:center; gap:16px; padding:16px 8px; cursor:pointer; transition:background .15s; }
  .entry-head:hover { background:rgba(255,255,255,.035); }
  .entry-idx { font-family:var(--mono); font-size:13px; color:var(--sub); width:32px; flex:none; text-align:right; }
  .entry-main { flex:1; min-width:0; }
  .entry-theme { font-size:18px; font-weight:700; color:var(--ink); line-height:1.4; letter-spacing:.2px; white-space:normal; overflow:visible; text-overflow:clip; word-break:break-word; }
  .entry-meta { margin-top:7px; display:flex; gap:8px; flex-wrap:wrap; }
  .entry-side { display:flex; align-items:center; gap:14px; flex:none; }
  .entry-counts { font-family:var(--mono); font-size:11px; color:var(--sub); letter-spacing:.5px; white-space:nowrap; }
  .entry-counts .ci { color:var(--teal-text); }
  .entry-counts .cv { color:var(--cfm); }
  .entry-chev { color:var(--sub); font-size:12px; transition:transform .2s; }
  .entry.open .entry-chev { transform:rotate(180deg); color:var(--amber-text); }
  .entry-body { max-height:0; overflow:hidden; transition:max-height .3s ease, padding .3s ease; padding:0 8px 0 56px; }
  .entry.open .entry-body { max-height:6000px; padding:4px 8px 24px 56px; }
  .entry.open { background:rgba(233,162,59,.04); }
  .entry-body .detail { max-height:none; }
  @media (max-width:820px){
    .hero-readout{ grid-template-columns:repeat(2,1fr); }
    .hero-grid{ gap:22px; } .hero-title{ font-size:34px; }
    .entry-body { padding-left:8px; }
    .entry-theme { white-space:normal; }
  }
  .tag { font-family:var(--mono); font-size:11px; letter-spacing:.5px; padding:3px 9px; border-radius:3px; font-weight:600; border:1px solid var(--line); }
  .tag-game.cf { background:var(--cf); color:#1a0c09; border-color:var(--cf); }
  .tag-game.cfm { background:var(--cfm); color:#06121c; border-color:var(--cfm); }
  .tag-game.cfhd { background:var(--cfhd); color:#120a1c; border-color:var(--cfhd); }
  .tag-game.empty { background:var(--panel3); color:var(--ink2); border-color:var(--line); }
  .tag-type { background:transparent; color:var(--ink2); border:1px solid var(--line); }
  .tag-time { color:var(--amber-text); border:1px solid rgba(233,162,59,.4); }
  .tag-time::before { content:"[ "; opacity:.6; } .tag-time::after { content:" ]"; opacity:.6; }
  .tag-img { border:1px solid rgba(63,176,163,.5); color:var(--teal-text); }
  .tag-vid { border:1px solid rgba(74,166,221,.5); color:var(--cfm); }
  .theme {
    font-size:18px; font-weight:800; margin-bottom:10px; color:var(--ink);
    line-height:1.45; white-space:pre-line; border-left:3px solid var(--amber); padding-left:12px;
  }
  .detail {
    font-size:14px; line-height:1.85; color:var(--ink2); white-space:pre-line; margin-bottom:14px;
    max-height:none; overflow:visible; position:relative; cursor:pointer; border-left:1px solid var(--line); padding-left:12px;
  }
  .detail.expanded { max-height:none; }
  .detail::after {
    content:"展开 ▾"; position:sticky; bottom:0; left:0; display:block; color:var(--amber-text);
    font-family:var(--mono); font-size:11px; background:linear-gradient(transparent,var(--panel)); padding:10px 0 2px;
  }
  .detail.expanded::after { content:"收起 ▴"; }

  /* ===== 图片画廊 ===== */
  .img-gallery {
    display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px;
    margin-bottom:14px; padding:14px; border-radius:4px; position:relative;
    background:var(--panel2); border:1px solid var(--line);
  }
  .img-gallery::before {
    display:block; grid-column:1/-1; font-family:var(--mono); font-size:10px; letter-spacing:1.5px;
    text-transform:uppercase; color:var(--sub); margin-bottom:4px;
  }
  .img-gallery.pv-gal::before { content:"IMG // PV 配图"; color:var(--teal-text); }
  .img-gallery.kv-gal::before { content:"IMG // KV 关键视觉"; color:var(--amber-text); }
  .img-gallery.act-gal::before { content:"IMG // 活动配图"; }
  .float-img {
    width:100%; height:auto; cursor:zoom-in; display:block;
    border:1px solid var(--line-bright); border-radius:3px;
    transition:transform .18s, box-shadow .18s;
  }
  .float-img:hover { transform:scale(1.03); box-shadow:0 0 0 1px var(--amber), 0 6px 18px -6px rgba(0,0,0,.6); }

  /* ===== 视频 ===== */
  .video-wrap { margin-top:10px; }
  .video-player { width:100%; max-height:340px; border-radius:4px; background:#000; display:block; border:1px solid var(--line); }
  .video-player.bili { aspect-ratio:16/9; height:auto; }
  .video-link {
    display:inline-flex; align-items:center; gap:6px; background:var(--amber);
    border:1px solid var(--amber); color:#1a1408; padding:6px 12px; border-radius:3px;
    font-size:12px; font-family:var(--mono); cursor:pointer; text-decoration:none; margin-top:6px; transition:.15s;
  }
  .video-link:hover { background:#f2b455; border-color:#f2b455; }
  .play-icon { width:0; height:0; border-left:8px solid currentColor; border-top:5px solid transparent; border-bottom:5px solid transparent; }

  /* ===== 分析区 ===== */
  .analysis { display:grid; grid-template-columns:1fr; gap:12px; margin-top:10px; }
  .analysis.single { grid-template-columns:1fr; }
  .ana-box {
    position:relative; background:var(--panel2); border:1px solid var(--line); border-radius:4px; padding:14px 16px;
  }
  .ana-box.pv { border-top:3px solid var(--teal); }
  .ana-box.kv { border-top:3px solid var(--amber); }
  .ana-box h4 {
    font-family:var(--mono); font-size:11px; letter-spacing:.5px; color:var(--ink2);
    margin-bottom:10px; font-weight:700; display:flex; align-items:center; gap:7px; text-transform:uppercase;
  }
  .ana-box h4 .dot { width:8px; height:8px; border-radius:50%; display:inline-block; }
  .ana-box.pv h4 .dot { background:var(--teal); }
  .ana-box.kv h4 .dot { background:var(--amber); }
  .ana-box p { font-size:14px; line-height:1.85; color:var(--ink2); white-space:pre-line; }
  .ana-box .h-label { font-family:var(--mono); font-size:10px; letter-spacing:1px; text-transform:uppercase; color:var(--teal-text); margin:12px 0 5px; font-weight:700; }
  .ana-box.kv .h-label { color:var(--amber-text); }
  .empty { text-align:center; color:var(--sub); padding:60px 0; font-family:var(--mono); font-size:14px; letter-spacing:.5px; }
  .empty::before { content:"[ NO MATCH ] "; color:var(--amber); }
  footer { text-align:center; color:#6f6c64; font-family:var(--mono); font-size:11px; margin-top:42px; letter-spacing:.5px; }

  /* ===== Lightbox ===== */
  .lb-overlay { display:none; position:fixed; inset:0; background:rgba(8,9,11,.94); z-index:999; justify-content:center; align-items:center; cursor:pointer; backdrop-filter:blur(4px); }
  .lb-overlay.active { display:flex; }
  .lb-overlay img { max-width:95vw; max-height:95vh; border-radius:3px; object-fit:contain; cursor:default; border:1px solid var(--line-bright); box-shadow:0 24px 70px -10px rgba(0,0,0,.7); transform-origin:center center; will-change:transform; }
  .lb-btn { position:absolute; top:50%; transform:translateY(-50%); width:52px; height:52px; line-height:52px; text-align:center; font-size:34px; color:#0e0f12; background:var(--amber); border:1px solid #0e0f12; border-radius:4px; cursor:pointer; user-select:none; z-index:3; transition:.15s; }
  .lb-btn:hover { background:#f2b455; }
  .lb-prev { left:24px; } .lb-next { right:24px; }
  .lb-count { position:absolute; bottom:22px; left:50%; transform:translateX(-50%); color:#ece8df; font-family:var(--mono); font-size:12px; background:var(--panel); padding:4px 12px; border-radius:2px; z-index:3; border:1px solid var(--line); }
  .lb-hint { position:absolute; bottom:50px; left:50%; transform:translateX(-50%); color:#cfccc4; font-family:var(--mono); font-size:11px; background:rgba(14,15,18,.8); padding:4px 12px; border-radius:2px; z-index:3; pointer-events:none; }
  .lb-overlay.single .lb-btn { display:none; }



  /* ===== v8 · Endfield DNA：左导航轨 + 分区金栏 + HUD 雷达环 ===== */
  .main { max-width:none; padding-left:56px; }
  .side-rail { position:fixed; left:12px; top:50%; transform:translateY(-50%);
    width:40px; z-index:40; display:flex; flex-direction:column; gap:7px; align-items:center; }
  .rail-item { width:36px; height:36px; border-radius:8px; border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center; cursor:pointer; transition:.18s;
    color:var(--sub); font-family:var(--mono); font-size:10.5px; font-weight:700; letter-spacing:.3px;
    background:var(--panel); text-decoration:none; padding:0; }
  .rail-item:hover { border-color:var(--amber); color:var(--amber-text); }
  .rail-item.active { background:var(--amber); border-color:var(--amber); color:#1a1408; }
  .rail-divider { width:18px; height:1px; background:var(--line); margin:5px 0; }

  .game-group { position:relative; margin-bottom:48px; }
  .game-group:last-child { margin-bottom:0; }
  .section-header { position:relative; background:var(--amber); padding:11px 84px 11px 22px;
    display:flex; align-items:center; gap:14px; }
  .sec-num { font-family:var(--mono); font-size:12px; font-weight:800; color:#1a1408; letter-spacing:1.5px; }
  .sec-name { font-size:15px; font-weight:800; color:#1a1408; letter-spacing:.8px; }
  .sec-count { margin-left:auto; font-family:var(--mono); font-size:11px; color:rgba(26,22,8,.6); letter-spacing:.5px; }
  .section-header::after { content:""; position:absolute; right:16px; top:50%; transform:translateY(-50%);
    width:52px; height:52px; border-radius:50%; border:1px solid rgba(26,22,8,.28);
    box-shadow:0 0 0 9px rgba(26,22,8,.12), inset 0 0 0 9px rgba(26,22,8,.12); pointer-events:none; }

  .entry-head { position:relative; }
  .entry-head:hover { background:rgba(232,184,32,.05); }
  .entry.open { background:rgba(232,184,32,.045); }
  .entry.open .entry-chev { transform:rotate(180deg); color:var(--amber-text); }
  .entry-thumb { display:none; position:absolute; right:14px; top:50%; transform:translateY(-50%);
    width:128px; height:72px; object-fit:cover; border-radius:4px; border:1px solid var(--line-bright);
    opacity:0; transition:opacity .2s; z-index:5; pointer-events:none; }
  .entry-head:hover .entry-thumb { display:block; opacity:1; }

  body::after { content:"COMPETITIVE INTELLIGENCE"; position:fixed; bottom:6%; left:2.5%;
    font-family:var(--sans); font-size:200px; font-weight:800; color:var(--ink);
    opacity:.018; pointer-events:none; z-index:0; letter-spacing:10px;
    writing-mode:vertical-rl; text-orientation:mixed; }
  body::before { content:var(--wm, "ALL"); position:fixed; right:3%; bottom:6%;
    font-family:var(--sans); font-size:140px; font-weight:800; color:var(--ink);
    opacity:.018; pointer-events:none; z-index:0; letter-spacing:10px; text-align:right; }

  @media (max-width:980px){
    .side-rail { display:none; }
    .main { padding-left:0; max-width:100%; }
  }


  /* ===== v9 · 去彩色 · 深炭灰 + 单一金 ===== */
  /* 游戏标签：全部中性描边，仅以文字区分，绝不上色 */
  .tag-game, .tag-game.cf, .tag-game.cfm, .tag-game.cfhd, .tag-game.empty,
  .tag-img, .tag-vid {
    background:transparent !important; color:var(--ink2) !important;
    border:1px solid var(--line) !important;
  }
  /* READOUT 数字统一为墨色，不再三色 */
  .ro.cf .ro-num, .ro.cfm .ro-num, .ro.cfhd .ro-num { color:var(--ink) !important; }
  /* 媒体计数（图/视频）统一中性灰，仅靠 ▣ / ▶ 图标区分 */
  .entry-counts .ci, .entry-counts .cv { color:var(--sub) !important; }
  .tag-img { color:var(--sub) !important; } .tag-vid { color:var(--sub) !important; }

  /* 分区头：实心金块 -> 深色面板 + 3px 细金左边线，去掉雷达环 */
  .section-header { background:var(--panel) !important; border:1px solid var(--line) !important;
    border-left:3px solid var(--amber) !important; padding:12px 22px 12px 20px !important; }
  .section-header::after { display:none !important; }
  .sec-num { color:var(--amber) !important; }
  .sec-name { color:var(--ink) !important; }
  .sec-count { color:var(--sub) !important; }

  /* 行 hover / 展开：收敛为极淡白，不再金底 */
  .entry-head:hover { background:rgba(255,255,255,.03) !important; }
  .entry.open { background:rgba(255,255,255,.022) !important; }
  .entry.open .entry-chev { color:var(--amber) !important; }

  /* 左导航轨：保持中性 + 单一金激活，去掉任何彩色 */
  .rail-item { color:var(--sub) !important; }
  .rail-item.active { background:var(--amber) !important; color:#1a1408 !important; border-color:var(--amber) !important; }


  /* ===== v10 · 时间线 ===== */
  .timeline { position:relative; max-width:1000px; margin:0 auto; padding:6px 0 40px; }
  .timeline::before { content:""; position:absolute; left:23px; top:0; bottom:0; width:2px; background:var(--line-soft); }
  .timeline::after { content:""; position:absolute; left:23px; top:0; width:2px; height:var(--prog,0%); background:var(--amber); transition:height .12s linear; }
  .tl-era { position:relative; padding-left:64px; margin:38px 0 16px; }
  .tl-era .era-label { font-family:var(--mono); font-size:12px; letter-spacing:3px; color:var(--amber); text-transform:uppercase; font-weight:700; }
  .tl-era::before { content:""; position:absolute; left:14px; top:50%; width:18px; height:18px; border-radius:50%; background:var(--bg); border:2px solid var(--amber); transform:translateY(-50%); box-shadow:0 0 0 5px var(--bg); }
  .tl-node { position:relative; padding-left:64px; margin-bottom:14px; opacity:0; transform:translateY(22px); transition:opacity .6s cubic-bezier(.2,.7,.2,1), transform .6s cubic-bezier(.2,.7,.2,1); }
  .tl-node.in { opacity:1; transform:none; }
  .tl-dot { position:absolute; left:16px; top:20px; width:15px; height:15px; border-radius:50%; background:var(--bg); border:2px solid var(--line-bright); transition:.3s; z-index:1; }
  .tl-node.in .tl-dot { border-color:var(--amber); box-shadow:0 0 0 4px rgba(232,184,32,.14); }
  .tl-card { background:var(--panel); border:1px solid var(--line); border-radius:7px; overflow:hidden; transition:border-color .2s, transform .25s; }
  .tl-node:hover .tl-card { border-color:var(--line-bright); transform:translateX(4px); }
  .tl-node.open .tl-card { border-color:var(--amber); }
  .tl-head { display:flex; align-items:center; gap:14px; padding:16px 18px; cursor:pointer; }
  .tl-date { font-family:var(--mono); font-size:11.5px; color:var(--amber); letter-spacing:.4px; flex:none; width:104px; line-height:1.35; }
  .tl-main { flex:1; min-width:0; }
  .entry-theme { font-size:19px; font-weight:600; color:var(--ink); line-height:1.35; letter-spacing:.2px; white-space:normal; overflow:visible; text-overflow:clip; word-break:break-word; }
  .entry-meta { margin-top:8px; display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .entry-side { display:flex; align-items:center; gap:12px; flex:none; position:relative; }
  .entry-counts { font-family:var(--mono); font-size:10.5px; color:var(--sub); letter-spacing:.5px; white-space:nowrap; }
  .entry-counts .ci, .entry-counts .cv { color:var(--sub); }
  .entry-chev { color:var(--sub); font-size:12px; transition:transform .2s; }
  .tl-node.open .entry-chev { transform:rotate(180deg); color:var(--amber); }
  .entry-thumb { display:none; position:absolute; right:8px; top:50%; transform:translateY(-50%); width:128px; height:72px; object-fit:cover; border-radius:4px; border:1px solid var(--line-bright); opacity:0; transition:opacity .2s; z-index:5; pointer-events:none; }
  .tl-head:hover .entry-thumb { display:block; opacity:1; }
  .entry-body { max-height:0; overflow:hidden; transition:max-height .35s ease, padding .35s ease; padding:0 18px; }
  .tl-node.open .entry-body { max-height:6000px; padding:4px 18px 26px; }
  @media (max-width:760px){
    .tl-node { padding-left:46px; }
    .timeline::before, .timeline::after { left:15px; }
    .tl-dot { left:8px; }
    .tl-era { padding-left:42px; }
    .tl-era::before { left:6px; }
    .tl-date { width:auto; }
    .tl-head { flex-wrap:wrap; gap:8px; }
  }


  

  

  

  

  

  /* ===== V14 · ARK UI 工业设计系统：深色底 + 荧光黄实心色块 + 极简几何 + 等宽微标 ===== */
  :root{
    --bg-deep:#0c0d0f;
    --bg-panel:#14161a;
    --bg-card:#1a1c21;
    --fg:#e8e6e3;
    --fg-dim:#8a8680;
    --accent:#d4ff00;          /* 荧光黄 / chartreuse — 唯一高饱和色 */
    --accent-dim:rgba(212,255,0,.12);
    --line-sub:#2a2d35;
    --line-bright:#3a3f4a;
    --mono:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;
    --sans:-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
  }
  body { color:var(--fg) !important; font-family:var(--sans);
    background:var(--bg-deep) !important; }
  /* 技术网格（极淡，近黑底上的细灰线） */
  .bg-grid { position:fixed; inset:0; pointer-events:none; z-index:0;
    background-image:
      linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
    background-size:40px 40px; }
  /* 扫描线 → 极淡水平纹理（几乎不可见，仅增加胶片感） */
  .scanlines { position:fixed; inset:0; pointer-events:none; z-index:5; mix-blend-mode:screen; opacity:.03;
    background:repeating-linear-gradient(0deg, rgba(255,255,255,.15) 0, rgba(255,255,255,.15) 1px, transparent 1px, transparent 4px); }
  /* 角标 → 纯几何 L 形（无装饰） */
  .hud-frame { position:fixed; inset:18px; pointer-events:none; z-index:7; }
  .hud-frame .c { position:absolute; width:22px; height:22px; border:1.5px solid var(--line-bright); }
  .hud-frame .tl { top:0; left:0; border-right:none; border-bottom:none; }
  .hud-frame .tr { top:0; right:0; border-left:none; border-bottom:none; }
  .hud-frame .bl { bottom:0; left:0; border-right:none; border-top:none; }
  .hud-frame .br { bottom:0; right:0; border-left:none; border-top:none; }
  /* 半调 → 极淡噪点纹理（非波点、非橙色） */
  .halftone { position:fixed; inset:0; pointer-events:none; z-index:2; opacity:.04; mix-blend-mode:screen;
    background-image:radial-gradient(circle, rgba(255,255,255,.35) 1px, transparent 2px);
    background-size:5px 5px; }
  @keyframes htDrift { from{background-position:0 0;} to{background-position:5px 5px;} }
  /* 横向胶片条 */
  .stage { position:relative; overflow-x:auto; overflow-y:visible; padding:18px 0 10px; z-index:1; scroll-behavior:auto; scrollbar-width:none; -ms-overflow-style:none; }
  .stage::-webkit-scrollbar { display:none; }

     底部字幕由 body padding-bottom 让位（footer 不被遮）。 */
  .ticker { position:fixed; left:0; right:0; height:34px; overflow:hidden; z-index:60;
    display:flex; align-items:center; pointer-events:none;
    border-top:1px solid var(--line-sub); border-bottom:1px solid var(--line-sub);
    background:var(--bg-panel); opacity:1; transition:opacity .3s ease;
    zoom: var(--fit); }   /* V34FIX19c · 跟随页面缩放（与 .wrap 同一 --fit） */
  .ticker-bot { bottom:0; }
  /* V34FIX19b/d · 内嵌像素字体 Press Start 2P（真 8-bit 点阵，woff2 base64 自包含）+
     关闭抗锯齿；字距 4px（像素字宽，8px 过散）；opacity .5 暗淡（主人：再暗淡一点） */
  .ticker-track { display:inline-flex; white-space:nowrap; flex:none;

  /* V34FIX19c · 方向=从右到左（主人明确）：translateX 0→-50% 递减，文字向左滚动 */

  body.film-open .ticker { opacity:0; }
  /* 底部字幕让位：页面滚动到底时 footer 下方留出 34px，不压住 footer 文字 */
  body { padding-bottom:34px; }
  .filmstrip { display:flex; gap:20px; align-items:flex-start; padding:10px 50vw; min-height:350px; }
  /* 卡片 = 深色面板 + 细边框 + 左侧色条（工业档案夹） */
  .hcard { flex:0 0 auto; width:360px; background:var(--bg-card);

    transition:transform .4s cubic-bezier(.16,1,.3,1), opacity .4s, border-color .3s, box-shadow .3s, background .3s, filter .3s;
    position:relative; cursor:pointer; overflow:hidden; }

    background:var(--accent); opacity:.7; }
  /* 无角标装饰（::after 清空） */
  .hcard::after { display:none; }
  /* 切换/入场动效：横向滚动式滑入（卡片从右侧滑入，错峰延迟） */

  .hcard { animation:cardIn .46s cubic-bezier(.22,1,.36,1) backwards; animation-delay:var(--d,0ms); }
  .hcard.active, .hcard.hot { opacity:1; transform:scale(1) translateY(0);

  .hcard.active .h-close, .hcard.hot .h-close { opacity:1; pointer-events:auto; }

    border-bottom:1px solid var(--line-sub); font-weight:400; }

  .h-date-t { flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  /* V29F · 展开态：右上角关闭按钮(距右 8~32px)会与编号(距右 16px)重叠，给日期行让出避让位 */
  .hcard.active .h-date, .hcard.hot .h-date { padding-right:34px; }
  /* 标题 = 超粗黑体（视觉锚点，参考图的大字号中文） */
  .h-theme { font-size:16px; font-weight:900; letter-spacing:-.5px; color:var(--fg); margin:8px 0 8px; line-height:1.2;

  .tag-game { color:var(--accent); border-color:var(--accent); background:var(--accent-dim); font-weight:600; }

  /* 底部仪表盘 = 精密仪器（细线弧 + 荧光黄指针/刻度） */
  /* V29D · 抓取范围收紧：cursor:grab 与命中判定都只落在圆环本体附近，读数/提示文字区不再误触 */
  .dial-wrap { position:relative; width:min(1100px,96vw); margin:110px auto 8px; touch-action:none; user-select:none; -webkit-user-select:none; }

  .dial-grab { fill:none; stroke:rgba(0,0,0,0); stroke-width:62; stroke-linecap:round; pointer-events:stroke; cursor:grab; }

/* V16C-START */
  /* V16C · 桌面宽屏利用：展开卡改宽面板 + 收敛胶卷条留白 */
  .filmstrip { padding:10px 2vw !important; }
  .hcard.active, .hcard.hot { width:min(1200px,94vw); }

  .hcard.active .analysis:not(.single), .hcard.hot .analysis:not(.single) { display:grid; grid-template-columns:1fr 1fr; gap:18px; }
  .hcard.active .analysis.single, .hcard.hot .analysis.single { display:block; }
  /* V16C-END */
/* V17B-START */
  /* V17B · 展开卡顶部 KV 不再裁成 104px 薄片，显示完整 KV（contain，封顶 280px）
     ⚠️ 2026-08-31 V33 修：原封顶是绝对 px，而展开卡的 max-height 是 vh 基准的，两者不同步。
        Ctrl+滚轮放大页面时视口 CSS 高度变小 → 卡变小，但 KV 恒为 280px×fit，占比从 24% 一路涨到
        42%（200% 缩放实测 KV 174px / 卡 416px），把下方 .h-body（详情 + 分析）挤到只剩 158px。
        改为「280px 与 21vh 取小」：21vh 在 100%/125% 下都不触发，保持原样（225 / 174px 不变），
        150% 起才生效，让 KV 随视口等比缩小。
        ⚠️ 必须除以 --fit：zoom 子树里 vh 不随缩放（见 V32 注释），不除的话 21vh 实际只占视口 17%。
        ⚠️ 切勿改成 flex:0 1 auto 让它参与收缩——.h-body 的 flex-basis 是内容实高（可达 2560 CSS px），
           按 shrink×basis 分配时 KV 会被压到 18px。KV 就该是 flex:0 0 auto，靠上限控制。 */
  .hcard.active .h-thumb, .hcard.hot .h-thumb {
    height:auto; max-height: min(280px, calc(21vh / var(--fit))); width:100%;
    object-fit:contain; background:var(--bg-deep);
    border-radius:2px; margin:6px 0 10px;
    cursor:zoom-in;
  }
/* V17B-END */

  /* V25-NOCLIP · 解除 v21 的字/图裁切 */
  .hcard.active .h-body > div, .hcard.hot .h-body > div { overflow:visible; }
  .detail::after, .detail.expanded::after { content:""; }

  /* V26-INTERACT · 首尾留白使端卡可居中 + 悬停轻高亮(不撑大，避免边界闪烁) */
  .filmstrip { padding-left:calc(50% - 180px) !important; padding-right:calc(50% - 180px) !important; }
  .hcard:not(.active):hover { opacity:.95; transform:scale(1) translateY(0); filter:brightness(1.18); border-color:var(--accent); box-shadow:0 12px 30px -12px rgba(0,0,0,.6); z-index:4; }

  


  


  /* V27B · 仅激活卡封顶内滚 + 深色滚动条 + 配图统一 */
  .hcard { display: flex; flex-direction: column; }
  /* ⚠️ 2026-08-31 V32 修：zoom 子树里 `vh` **不随 zoom 缩放**（实测 100vh 的 computed 恒为未缩放的
     视口高，rect 才是缩放后的物理高），而 px 会。所以 `calc(100vh - 200px)` 这种混合单位在缩放后
     比例失衡。这里把 vh 项除以 --fit，换算成「缩放坐标系里的视口高」，px 项保持不变
     （200px 是保留给页面 chrome 的净空，它同样被缩放，量纲一致）。 */
  .hcard.active { max-height: calc(100vh / var(--fit) - 200px); width: min(1100px, 90vw); }
  /* ⚠️ 2026-08-31 修：此处原写 `.h-card .h-meta`（下划线拼写错误，实际类名是 .hcard），
     导致 .h-meta 是这一列里【唯一】没拿到 flex:0 0 auto 的项 → 默认 flex-shrink:1。
     展开卡在矮视口下（如 566px 高的预览面板，max-height 仅 366px）空间不够时，
     只有标签行被压缩：实测渲染高 7.7~9.4px 而内容高 22px，标签被切掉一半。 */
  .hcard .h-date, .hcard .h-theme, .hcard .h-meta, .hcard .h-thumb { flex: 0 0 auto; }
  .h-body { display: none !important; grid-template-rows: auto !important; }
  .hcard.active .h-body {
    display: block !important; grid-template-rows: auto !important;
    overflow-y: auto !important; overflow-x: hidden !important;
    flex: 1 1 auto; min-height: 0; max-height: calc(100vh / var(--fit) - 320px);
  }
  .h-body > div { overflow: visible !important; min-height: 0; }
  .h-body::-webkit-scrollbar { width: 5px; }
  .h-body::-webkit-scrollbar-track { background: transparent; }
  .h-body::-webkit-scrollbar-thumb { background: var(--line-bright); border-radius: 3px; }

    .hcard:not(.active):not(.hot) .h-meta .tag { padding:2px 5px; letter-spacing:0; }
    .hcard:not(.active):not(.hot) .h-meta .entry-counts .ci,
    .hcard:not(.active):not(.hot) .h-meta .entry-counts .cv { font-size:10px; }
    /* 超长类型名（如「新皮肤/角色（限定传奇级）」）自己省略，保住后面的图/视频计数徽章 */
    .hcard:not(.active):not(.hot) .h-meta .tag-type {
      max-width:118px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    }
  }
/* V30A-END */

/* V29B-START */
  /* V29B · READOUT 重排：4 个总数 2×2 + 4 个类型环形饼图（覆盖上方 ARK 段给 .ro 加的四周边框，避免出现双线） */
  .hero-readout .ro {
    border:none; border-right:1px solid var(--line-soft); border-bottom:1px solid var(--line-soft);
    background:transparent;
  }
  .hero-readout .ro:nth-child(2n) { border-right:none; }
  .hero-readout .ro:nth-child(n+3) { border-bottom:none; }
  /* V29J · 四个统计数字统一浅白，不按端着色（与饼图「颜色只属于类别」保持一致） */
  .hero-readout .ro-num,
  .hero-readout .ro.cf .ro-num,
  .hero-readout .ro.cfm .ro-num,
  .hero-readout .ro.cfhd .ro-num { color:var(--ink); }
  @media (max-width:760px){
    .dn-box { max-width:60px; }
    .dn-cap { font-size:8.5px; }
  }
/* V29B-END */

/* V32-START · 跨分辨率等比缩放（4K / 2K / 1080p 视觉比例一致） */
  /* 量「基准高度」用的临时态：refit() 量之前挂上、量完立刻摘掉，只存在一帧，肉眼不可见。
     目的：不管此刻有没有卡片展开，量到的都是【全折叠】时的自然高度。
     否则会出现「点开一张卡 → 页面变高 → fit 变小 → 整页缩水」这种反直觉联动。
     ⚠️ 必须放在样式表末尾：.h-body 那条要压过前面的 .hcard.active .h-body{display:block!important}
        （两者特异性相同 0,3,0，靠源码顺序决胜）。 */
  .wrap.fit-measuring .h-body { display: none !important; }
  .wrap.fit-measuring .hcard.active,
  .wrap.fit-measuring .hcard.hot {
    width: auto !important; max-height: none !important;
    height: 300px !important; padding-bottom: 28px !important; overflow: hidden !important;
  }
  .wrap.fit-measuring .hcard.active .h-theme,
  .wrap.fit-measuring .hcard.hot .h-theme {
    display:-webkit-box !important; -webkit-line-clamp:2; -webkit-box-orient:vertical;
    overflow:hidden; height:38px !important; min-height:38px !important; max-height:38px !important;
    margin:8px 0 8px !important;
  }
  .wrap.fit-measuring .hcard.active .h-meta,
  .wrap.fit-measuring .hcard.hot .h-meta {
    height:22px !important; min-height:22px !important; max-height:22px !important;
    overflow:hidden !important; flex-wrap:nowrap !important;
  }
  .wrap.fit-measuring .hcard.active .h-thumb,
  .wrap.fit-measuring .hcard.hot .h-thumb {
    height:100px !important; min-height:100px !important; max-height:100px !important;
  }
/* V32-END */

/* V34-START · 展开/收起过渡动画（2026-09-01 主人要求） */
  /* 目标：点卡片展开/收起时，宽度、高度、内容有平滑过渡，不再瞬间跳变。
     方案（纯 CSS，不动 V30A 等高 / V32 缩放 / V33 KV 收缩 / JS）：
       1) 卡片 transition 追加 width + max-height（沿用项目缓动 cubic-bezier(.16,1,.3,1)）
       2) 折叠态补 max-height:260px 作为「高度过渡锚点」——展开时 260 → calc(100vh/fit-200) 平滑长高
       3) 展开态 .h-body 播放入场动画：内容自下而上淡入
     ⚠️ 收起方向：.h-body 是 display:none 硬切换（内容不可过渡），高度会随内容消失瞬时回到 260；
        靠 transform scale + opacity + width 三条过渡做「缩小、变淡、变窄」的连续收起感。
        若日后要「收起也做高度渐变」，需改 activate() 延迟 remove active（另开一轮）。 */
  .hcard {
    transition: transform .4s cubic-bezier(.16,1,.3,1), opacity .4s,
      border-color .3s, box-shadow .3s, background .3s, filter .3s,
      width .5s cubic-bezier(.16,1,.3,1), max-height .5s cubic-bezier(.16,1,.3,1);
  }
  /* 折叠态高度过渡锚点 = 折叠统一高度 300（2026-09-01 随卡片整体放大 260→300，
     与 V25 的 .hcard:not(.active):not(.hot){height:300px} 同步——锚点不一致时
     min(height,max-height)=260 会截断放大，实测折叠高不变化） */
  .hcard:not(.active):not(.hot) { max-height: 300px; }
  @keyframes hbIn {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .hcard.active .h-body, .hcard.hot .h-body {
    animation: hbIn .45s cubic-bezier(.16,1,.3,1);
  }
/* V34-END */

<script>



function fmtType(t){ return t || '未分类'; }
function esc(s){
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
/* V31 · 轻量 Markdown：转义后把 **重点** 渲染为 <strong>。
   仅用于我们自己写入的分析文本（detail / pv_analysis / kv_analysis），数据非外部注入；
   先 esc 再替换，保证 < > & 不破坏页面、也不被注入。 */
function fmt(s){
  return esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
}
function bvidOf(u){ const m=u.match(/BV[\w]+/); return m?m[0]:''; }

/* 把时间文本解析成 [年,月,日] 可比较元组（与 Python parse_time 对齐） */
function parseTime(t){
  if(!t) return [0,0,0];
  t = t.replace(/\s+/g,'');
  if(!t) return [0,0,0];
  const head = t.split(/[-到~]/)[0];
  if(!head) return [0,0,0];
  const m = head.match(/^(\d+)(?:\.(\d+))?(?:\.(\d+))?$/);
  if(!m) return [0,0,0];
  const g = m.slice(1).filter(Boolean).map(Number);
  const n0 = g[0];
  let year, month=0, day=0;
  if(n0 > 100){
    const s = String(n0);
    year = 2000 + parseInt(s.slice(0,2),10);
    month = s.length>2 ? parseInt(s.slice(2),10) : 0;
    day = g.length>1 ? g[1] : 0;
  } else {
    year = 2000 + n0;
    month = g.length>1 ? g[1] : 0;
    day = g.length>2 ? g[2] : 0;
  }
  return [year, month, day];
}
function cmpT(a,b){
  if(a[0]!==b[0]) return a[0]-b[0];
  if(a[1]!==b[1]) return a[1]-b[1];
  return a[2]-b[2];
}
function ymd(s){ if(!s) return null; const p=s.split('-').map(Number); return [p[0],p[1],p[2]]; }

/* ---- 视频/链接渲染 (F列内嵌) ---- */
function videoHtml(pvLinks){
  if(!pvLinks || !pvLinks.length) return '';
  let out = '<div class="video-wrap">';
  pvLinks.forEach(function(p){
    const u = p.url, kind = p.kind;
    if(kind === 'mp4'){
      out += '<video class="video-player" controls preload="none" src="'+esc(u)+'">浏览器不支持视频播放</video>';
    } else if(kind === 'gif'){
      out += '<img class="float-img" src="'+esc(u)+'" loading="lazy" referrerpolicy="no-referrer" onclick="lightboxUrl(this.src)" alt="动图素材">';
    } else if(kind === 'bilibili'){
      const bv = bvidOf(u);
      if(bv){
        const src = 'https://player.bilibili.com/player.html?bvid='+bv+'&page=1&high_quality=1&danmaku=0&autoplay=0';
        /* V30B · 不能用 loading="lazy"：PV 区位于 .h-body 内滚区最底部，
           折叠态下永远在视口之外，懒加载的 iframe 不会发起请求 → 点了展开只见黑框。
           卡片体本身已是点击后才 fillBody 填充，等于天然懒加载，这里必须 eager。 */
        out += '<iframe class="video-player bili" src="'+esc(src)+'" allowfullscreen scrolling="no" frameborder="0" loading="eager"></iframe>';
      }
      out += '<a class="video-link" href="'+esc(u)+'" target="_blank" rel="noopener"><span class="play-icon"></span>在 B站打开观看</a>';
    } else if(kind === 'weixin_drive' && p.local){
      // 已本地落盘 -> 直接内嵌播放
      out += '<video class="video-player" controls preload="none" src="'+esc(p.local)+'">浏览器不支持视频播放</video>';
      out += '<a class="video-link" href="'+esc(u)+'" target="_blank" rel="noopener"><span class="play-icon"></span>在企微云盘打开原片</a>';
    } else {
      // weixin_drive / other -> 直接可点击链接（云盘需登录企微）
      const txt = (kind==='weixin_drive' ? '在企微云盘打开播放' : '打开视频/链接');
      const sub = (kind==='weixin_drive' && p.label)
        ? '<span style="font-size:11px;opacity:.8;margin-left:6px">'+esc(p.label)+'</span>' : '';
      out += '<a class="video-link" href="'+esc(u)+'" target="_blank" rel="noopener">'
        + '<span class="play-icon"></span>'+txt+sub+'</a>';
    }
  });
  out += '</div>';
  return out;
}

/* ---- 图片画廊渲染 ---- */
function galleryHtml(imgs, cls, ci, baseIdx){
  if(!imgs || !imgs.length) return '';
  const items = imgs.map(function(u, i){
    return '<img class="float-img" src="'+esc(u)+'" referrerpolicy="no-referrer" title="点击放大查看原图"'
      +' onclick="lightboxOpen('+ci+','+(baseIdx+i)+')" alt="活动素材">';
  }).join('');
  return '<div class="img-gallery '+cls+'-gal">'+items+'</div>';
}

function t2(t){
  const n=(t||'').replace(/\s+/g,' ');
  if(!n) return '';
  return '<span class="tag-time">'+esc(n)+'</span>';
}

function mediaCounts(r){
  var _kvRaw=(r.kv||'').toString().trim();
  var kvExtra=(/^https?:\/\//i.test(_kvRaw)||/\.(png|jpe?g|webp|gif|bmp|svg)$/i.test(_kvRaw))?1:0;
  var kvImgs=(r.kv_images||[]).concat(kvExtra?[_kvRaw]:[],(r.kv_cell_images||[]).map(function(x){return x.url;})).length;
  var totalImgs=(r.activity_images||[]).length+kvImgs+(r.pv_images||[]).length;
  var totalVids=(r.pv_links||[]).length;
  return {totalImgs:totalImgs,totalVids:totalVids};
}
function cardBody(r){
  const activityImgs=r.activity_images||[];
  var _kvExtra=[];
  if(r.kv){ var _kvRaw=String(r.kv).trim();
    if(/^https?:\/\//i.test(_kvRaw)||/\.(png|jpe?g|webp|gif|bmp|svg)$/i.test(_kvRaw)){ _kvExtra.push(_kvRaw); } }
  const kvImgs=(r.kv_images||[]).concat(_kvExtra,(r.kv_cell_images||[]).map(function(x){return x.url;}));
  const pvImgs=r.pv_images||[];
  const allImgs=activityImgs.concat(pvImgs,kvImgs);
  const ci=(window.__GALL.push(allImgs)-1);
  const pvLinks=r.pv_links||[];
  const title=r.theme||r.time||'未命名活动';
  const pvHas=(pvLinks.length||r.pv||r.pv_analysis||pvImgs.length);
  const kvHas=(kvImgs.length||r.kv||r.kv_analysis);
  const pvBox=pvHas?('<div class="ana-box pv">'+'<h4><span class="dot"></span>PV 素材<span class="ana-toggle" onclick="toggleAna(this)">收起 ▴</span></h4>'+videoHtml(pvLinks)+(r.pv&&!pvLinks.length?'<div style="font-size:12px;color:var(--sub);margin-top:6px">'+esc(r.pv)+'</div>':'')+(r.pv_analysis?'<div class="h-label">PV 分析</div><p>'+fmt(r.pv_analysis)+'</p>':'')+galleryHtml(pvImgs,'pv',ci,activityImgs.length)+'</div>'):'';
  const kvBox=kvHas?('<div class="ana-box kv">'+'<h4><span class="dot"></span>KV 素材<span class="ana-toggle" onclick="toggleAna(this)">收起 ▴</span></h4>'+galleryHtml(kvImgs,'kv',ci,activityImgs.length+pvImgs.length)+(r.kv&&!kvImgs.length?'<div style="font-size:12px;color:var(--sub);margin-top:6px">'+esc(r.kv)+'</div>':'')+(r.kv_analysis?'<div class="h-label">KV 分析</div><p>'+esc(r.kv_analysis)+'</p>':'')+'</div>'):'';
  const analysis=(pvBox||kvBox)?('<div class="analysis'+(pvBox&&kvBox?'':' single')+'">'+pvBox+kvBox+'</div>'):'';
  return (r.detail&&r.detail!==title?'<div class="detail">'+esc(r.detail)+'</div>':'')
    + (activityImgs.length?galleryHtml(activityImgs,'act',ci,0):'')
    + analysis;
}
function bestKv(r){
  if(!r) return '';
  if(r.kv){ return (typeof r.kv==='string')?r.kv:(r.kv_images&&r.kv_images.length?r.kv_images[0]:''); }
  if(r.kv_images&&r.kv_images.length) return r.kv_images[0];

function collapseCard(card){

  var cards=[].slice.call(stage.querySelectorAll('.hcard'));
  /* V34FIX19c · 收起立即恢复字幕（不等动画结束——主人：关闭卡片详细后要马上出字幕）。
     收起动画进行中字幕即可淡入，无需等 follow 收尾。 */
  document.body.classList.remove('film-open');
  cards.forEach(function(c){ if(c.getAnimations) c.getAnimations().forEach(function(an){ an.cancel(); }); });

     根因 = 快速操作序列下（如切换进行中就关闭），其他卡的收起/展开补间被上面的
     cancel 打断，其 onfinish（负责摘除 active）不执行 → 那张卡 active 永久残留、

     关闭本卡的语义是「不留下任何打开的卡」。 */

     15px → cancel 时高度闪跳约 9px（实测 WAAPI 终值 145.5 vs CSS 折叠 153.1，虽然 scroll

    card.classList.remove('hot');                        /* 防御：closeCard/ESC 场景同清 hot */

    doc.scrollTop=yKeep;                                 /* remove active 布局变化后恢复 scrollY */

    if(animA.playState==='running'||animA.playState==='pending'){

    var yc=window.scrollY||doc.scrollTop;

    if(Math.abs(yc-target)>0.5) doc.scrollTop=target;

    var yEnd=window.scrollY||doc.scrollTop;

/* Lightbox */
let lbList = [];
let lbIdx = 0;
let lbScale = 1, lbTX = 0, lbTY = 0;
let lbDrag = false, lbSX = 0, lbSY = 0, lbOX = 0, lbOY = 0;

function applyZoom(){
  const img = document.getElementById('lbImg');
  img.style.transform = 'translate('+lbTX+'px,'+lbTY+'px) scale('+lbScale+')';
  img.style.cursor = (lbScale > 1) ? 'grab' : 'default';
  updateCount();
}
function resetZoom(){ lbScale = 1; lbTX = 0; lbTY = 0; applyZoom(); }
function updateCount(){
  let t = (lbIdx+1) + ' / ' + lbList.length;
  if(lbScale > 1) t += '  ·  ' + Math.round(lbScale*100) + '%';
  document.getElementById('lbCount').textContent = t;
}
function showLb(){
  const img = document.getElementById('lbImg');
  img.src = lbList[lbIdx];
  document.getElementById('lb').classList.add('active');
  resetZoom();
}
function lightboxOpen(ci, idx){
  lbList = window.__GALL[ci] || [];
  if(!lbList.length) return;
  lbIdx = idx;
  document.getElementById('lb').classList.toggle('single', lbList.length <= 1);
  showLb();
}
function lightboxUrl(u){
  lbList = [u]; lbIdx = 0;
  document.getElementById('lb').classList.add('single');
  showLb();
}
function lightboxNav(d){
  if(!lbList.length) return;
  lbIdx = (lbIdx + d + lbList.length) % lbList.length;
  showLb();
}
document.getElementById('lb').addEventListener('click', function(e){
  if(e.target === this) this.classList.remove('active');
});
/* 自由缩放：滚轮缩放(1x~5x) + 双击放大/复位 + 拖拽平移 */
const lbImg = document.getElementById('lbImg');
lbImg.addEventListener('wheel', function(e){
  e.preventDefault();
  let s = lbScale * (e.deltaY < 0 ? 1.15 : 1/1.15);
  s = Math.max(1, Math.min(5, s));
  if(s === 1){ lbTX = 0; lbTY = 0; }
  lbScale = s; applyZoom();
}, {passive:false});
lbImg.addEventListener('dblclick', function(e){
  e.stopPropagation();
  if(lbScale > 1){ lbScale = 1; lbTX = 0; lbTY = 0; }
  else { lbScale = 2.5; }
  applyZoom();
});
lbImg.addEventListener('mousedown', function(e){
  if(lbScale <= 1) return;
  lbDrag = true; lbSX = e.clientX; lbSY = e.clientY; lbOX = lbTX; lbOY = lbTY;
  lbImg.style.cursor = 'grabbing'; e.preventDefault();
});
window.addEventListener('mousemove', function(e){
  if(!lbDrag) return;
  lbTX = lbOX + (e.clientX - lbSX);
  lbTY = lbOY + (e.clientY - lbSY);
  applyZoom();
});
window.addEventListener('mouseup', function(){ if(lbDrag){ lbDrag = false; lbImg.style.cursor = 'grab'; } });

function render(){
  window.__GALL = [];
  const kw=q.split(/\s+/).filter(Boolean);
  const list=DATA.filter(r=>{
    if(game && r.game!==game) return false;
    if(typeSel && fmtType(r.type)!==typeSel) return false;
    if(kw.length){
      const hay=(r.theme+' '+(r.type||'')+' '+(r.detail||'')+' '+(r.game||'')).toLowerCase();
      if(!kw.every(k=>hay.includes(k))) return false;
    }
    if(fromT || toT){
      const st = parseTime(r.time);
      if(!st[0]) return false;
      if(fromT && cmpT(st, fromT) < 0) return false;
      if(toT && cmpT(st, toT) > 0) return false;
    }
    return true;
  });
  infoEl.textContent='共 '+list.length+' / '+DATA.length+' 条';
  emptyEl.style.display=list.length?'none':'block';
  if(!list.length){ listEl.innerHTML=''; return; }
  function sortKey(t){
    if(!t) return [0,0,0];
    t=(''+t).replace(/\s+/g,'');
    const head=t.split(/[-到~]/)[0].replace(/\.$/,'');
    let m=head.match(/^(20\d{2})\.(\d{1,2})(?:\.(\d{1,2}))?$/);
    if(m) return [+m[1],+m[2], m[3]?+m[3]:0];
    m=head.match(/^(\d{2})\.(\d{1,2})(?:\.(\d{1,2}))?$/);
    if(m) return [2000+ +m[1], +m[2], m[3]?+m[3]:0];
    m=head.match(/^(\d{2})(\d{1,2})\.(\d{1,2})$/);
    if(m) return [2000+ +m[1], +m[2], +m[3]];
    m=head.match(/^(\d{2})(\d{2})(\d{2})$/);
    if(m) return [2000+ +m[1], +m[2], +m[3]];
    return [0,0,0];
  }
  function ymdC(a,b){ for(let i=0;i<3;i++){ if(a[i]!==b[i]) return a[i]-b[i]; } return 0; }
  list.sort(function(a,b){ return ymdC(sortKey(b.time), sortKey(a.time)); });
  let cards=list.map(function(r,ii){ return tlNode(r,ii,list.length); }).join('');
  const dial='<div class="dial-wrap">'
    +'<div class="dial-stage">'
    +'<svg class="dial" viewBox="0 0 1000 200" preserveAspectRatio="xMidYMax meet">'
    +'<path class="dial-base" d="M315,195 A185,185 0 0 1 685,195"/>'
    +'<path class="dial-ring" d="M315,195 A185,185 0 0 1 685,195"/>'

    +'</div>'
    +'<div class="dial-readout" id="dialReadout">REC --- / ---   ---</div>'
    +'<div class="dial-hint">↻ 抓盘旋转：拖动圆环，胶片随指针滚动</div>'
    +'</div>';
  /* V34FIX19 · 滚动字幕文案（无缝滚动：track 内容复制 2 份，动画 -50% 循环）。
     字段间加大间隔（&nbsp;&nbsp;）+ 字距 letter-spacing 8px（V34FIX19b）。
     仅保留底部一条（主人 2026-09-01 去掉顶部），向右滚动（tickR）。 */
  var TICK=(function(){ var s='CF&nbsp;&nbsp;CFM&nbsp;&nbsp;CFHD&nbsp;&nbsp;&nbsp;&nbsp;COMPETITIVE&nbsp;&nbsp;INTELLIGENCE&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;';
    var r=''; for(var i=0;i<10;i++) r+=s; return r; })();
  listEl.innerHTML='<div class="stage" id="film"><div class="filmstrip">'+cards+'</div></div>'+dial;
  /* V34FIX19 · 填充底部字幕内容（静态容器在 body，渲染时刷新） */
  var tb=document.getElementById('tickBot'); if(tb) tb.innerHTML=TICK;
}

// 详情展开/收起
document.addEventListener('click',e=>{
  if(e.target.classList && e.target.classList.contains('detail')){
    e.target.classList.toggle('expanded');
  }
});
// ESC 关闭 lightbox；灯箱未开时 ESC 收起胶片详情页（与 X 按钮 closeCard 行为一致）
document.addEventListener('keydown',e=>{
  const ov=document.getElementById('lb');
  if(ov.classList.contains('active')){
    if(e.key==='Escape'){ ov.classList.remove('active'); }

  }
  if(e.key==='Escape'){
    const open=document.querySelector('.hcard.active, .hcard.hot');

    if(open) collapseCard(open);

});
/* V29B · 全量读数：类型构成环形饼图（总体 + CF / CFM / CFHD），数字由 DATA 实时统计，不再硬编码 */
/* V29G · 固定五类归并：71 种原始类型一律归入「新皮肤 / 新武器 / 大型版本更新 / 福利 / 其他」，
   顺序即优先级（同时命中多个关键词时取靠前者），颜色随类别固定，四个饼图共用同一套配色 */
const DN_CATS = [
  { k:'新皮肤',       kw:['新皮肤','皮肤'] },
  { k:'新武器',       kw:['新武器','武器'] },
  { k:'大型版本更新', kw:['大型版本更新'] },
  { k:'福利',         kw:['福利'] },
  { k:'其他',         kw:null }
];
const DN_COLORS = ['#e8b820','#5fbf8f','#4aa6dd','#e669a4'];
const DN_OTHER  = '#8d8a82';
function dnGameKey(r){
  var g=(r.game||'').toLowerCase();
  return g.indexOf('cfhd')>=0?'cfhd':(g.indexOf('cfm')>=0?'cfm':(g.indexOf('cf')>=0?'cf':'other'));
}
function dnCat(type){
  var t=(type||'').toString().trim();
  for(var i=0;i<DN_CATS.length;i++){
    var c=DN_CATS[i], kw=c.kw;
    if(!kw) return c.k;
    for(var j=0;j<kw.length;j++){ if(t.indexOf(kw[j])>=0) return c.k; }
  }
  return '其他';
}
function dnTypeStats(scope){
  var m={};
  for(var i=0;i<DN_CATS.length;i++) m[DN_CATS[i].k]=0;
  for(var i=0;i<DATA.length;i++){
    var r=DATA[i];
    if(scope!=='all' && dnGameKey(r)!==scope) continue;
    m[dnCat(r.type)]++;
  }
  var items=DN_CATS.map(function(c){
    return { k:c.k, v:m[c.k], other:(c.k==='其他') };
  });
  var total=items.reduce(function(s,x){ return s+x.v; },0);
  return { items:items, total:total, kinds:DN_CATS.length };
}
function dnSvg(d, scopeName){
  var R=26, C=2*Math.PI*R, cx=34, cy=34, sw=11, off=0, segs='';
  for(var i=0;i<d.items.length;i++){
    var it=d.items[i];
    var frac = d.total ? it.v/d.total : 0;
    var len  = C*frac;
    var col  = it.other ? DN_OTHER : DN_COLORS[i % DN_COLORS.length];
    segs += '<circle class="dn-seg" cx="'+cx+'" cy="'+cy+'" r="'+R+'" fill="none" stroke="'+col+'" stroke-width="'+sw+'"'
          + ' stroke-dasharray="'+len.toFixed(2)+' '+(C-len).toFixed(2)+'" stroke-dashoffset="'+(-off).toFixed(2)+'"'
          + ' transform="rotate(-90 '+cx+' '+cy+')"'
          + ' data-k="'+esc(it.k)+'" data-v="'+it.v+'"'
          + (it.v ? '' : ' pointer-events="none"') + '>'
          + '<title>'+esc(scopeName+' · '+it.k)+' '+it.v+' 条 · '+(frac*100).toFixed(1)+'%</title></circle>';
    off += len;
  }
  return '<svg class="dn" viewBox="0 0 68 68" role="img">'
       + '<circle cx="'+cx+'" cy="'+cy+'" r="'+R+'" fill="none" stroke="rgba(255,255,255,.07)" stroke-width="'+sw+'"></circle>'
       + segs
       + '<text class="dn-num" x="'+cx+'" y="'+cy+'" text-anchor="middle" dominant-baseline="central">'+d.total+'</text>'
       + '</svg>';
}
/* V29I · 数值改为悬停查看：悬停扇区 → 圆心显示该类数量、端名临时替换为类别名 */
function bindDonutHover(){
  var cells=document.querySelectorAll('.dn-cell');
  Array.prototype.forEach.call(cells, function(cell){
    var num=cell.querySelector('.dn-num'), cap=cell.querySelector('.dn-cap');
    if(!num||!cap) return;
    var total=num.textContent, capText=cap.textContent;
    Array.prototype.forEach.call(cell.querySelectorAll('.dn-seg'), function(seg){
      var k=seg.getAttribute('data-k'), v=seg.getAttribute('data-v');
      seg.addEventListener('mouseenter', function(){
        num.textContent=v; cap.textContent=k; cap.classList.add('hover');
      });
      seg.addEventListener('mouseleave', function(){
        num.textContent=total; cap.textContent=capText; cap.classList.remove('hover');
      });
    });
  });
}
function buildReadout(){
  var counts={ all:DATA.length, cf:0, cfm:0, cfhd:0 };
  for(var i=0;i<DATA.length;i++){ var k=dnGameKey(DATA[i]); if(counts[k]!==undefined) counts[k]++; }
  var set=function(id,v){ var el=document.getElementById(id); if(el) el.textContent=v; };
  set('roTotal',counts.all); set('roCF',counts.cf); set('roCFM',counts.cfm); set('roCFHD',counts.cfhd);

  var scopes=[['all','总体','tot'],['cf','CF','cf'],['cfm','CFM','cfm'],['cfhd','CFHD','cfhd']];
  var row=document.getElementById('donutRow');
  if(row){
    row.innerHTML = scopes.map(function(s){
      var d=dnTypeStats(s[0]);
      return '<div class="dn-cell '+s[0]+'" title="'+s[1]+' 共 '+d.total+' 条（悬停扇区查看各类数量）">'
           + '<div class="dn-box">'+dnSvg(d, s[1])+'</div>'
           + '<div class="dn-cap">'+s[1]+'</div>'
           + '</div>';
    }).join('');
    // V29J · 类别名共享一行，纯文字不带色块；数值改为悬停饼图扇区查看
    var tl=document.getElementById('typeLegend');
    if(tl){
      tl.innerHTML = DN_CATS.map(function(c){
        return '<span class="dn-lg">'+esc(c.k)+'</span>';
      }).join('');
    }
    bindDonutHover();
  }
}
buildReadout();
render();
</script>



















<script>
(function(){
  // ARK UI 覆盖层：技术网格 / 极淡纹理 / 几何角标
  function addLayer(cls, html){
    if(!document.querySelector('.'+cls)){
      var d=document.createElement('div'); d.className=cls;
      if(html) d.innerHTML=html; document.body.appendChild(d);
    }
  }
  addLayer('bg-grid');
  addLayer('scanlines');
  addLayer('hud-frame', '<i class="c tl"></i><i class="c tr"></i><i class="c bl"></i><i class="c br"></i>');
  if(!document.querySelector('.halftone')){ var ht=document.createElement('div'); ht.className='halftone'; document.body.appendChild(ht); }

  /* ===== V32 · 整页等比缩放：矮屏一屏看全，且与高屏保持同一视觉比例 =====
     做法：按视口高度算一个 fit，写到 :root 的 --fit，由 .wrap{zoom:var(--fit)} 整体缩放。
     为什么不直接改各处字号/间距：那样 4K 与 2K 的版面比例必然不同，主人要的是「比例一致」。 */
  var MIN_FIT = 0.62;   // 再小字就看不清了，宁可留一点滚动
  var BODY_PAD = 130;   // body padding: 40(top) + 90(bottom)，在 .wrap 之外、不参与缩放，所以是定值
  function refit(){
    var wrap = document.querySelector('.wrap');
    if(!wrap) return;
    // ⚠️ 必须先把 zoom 归 1 再量：zoom 下 getBoundingClientRect 返回的是缩放后的物理高，
    //    拿它当 natural 会形成「越缩越缩」的正反馈。
    var prev = wrap.style.zoom;
    wrap.style.zoom = '1';
    wrap.classList.add('fit-measuring');   // 抹平「有卡展开」带来的高度差，量到的恒为全折叠基准高
    var natural = wrap.getBoundingClientRect().height;
    wrap.classList.remove('fit-measuring');
    wrap.style.zoom = prev;
    if(!natural) return;
    var avail = window.innerHeight - BODY_PAD - 2;   // 2px 余量吸收亚像素舍入
    var fit = Math.max(MIN_FIT, Math.min(1, avail / natural));
    // ⚠️ 必须向下取整（floor 不是 round）：round 到 0.1% 会多出 1~3px，页面又冒出一条滚动条
    fit = Math.floor(fit * 1000) / 1000;
    document.documentElement.style.setProperty('--fit', fit);
  }
  var _fitT = 0;
  function refitSoon(){ clearTimeout(_fitT); _fitT = setTimeout(refit, 120); }
  window.addEventListener('resize', refitSoon);
  window.__refit = refit;

  /* V17-STAGE · 每次 render 后重新绑定到实时 #film，避免重渲后监听失效 */
  function getStage(){ return document.getElementById('film'); }
  function setDialHandle(p){
    p=Math.max(0,Math.min(1,p||0));
    var h=document.getElementById('dialHandle');
    if(!h) return;
    var th=Math.PI - p*Math.PI; // 左端180° → 右端0°
    var cx=500+185*Math.cos(th), cy=195-185*Math.sin(th);
    h.setAttribute('cx', cx.toFixed(1));
    h.setAttribute('cy', cy.toFixed(1));
  }
  /* 卡片中心缓存：渲染时算一次，滚动时不再逐卡 getBoundingClientRect（避免每帧 reflow 卡顿） */
  var cardEls=[], cardCenters=[];
  function cacheCards(){
    var stage=getStage(); if(!stage) return;
    cardEls=Array.prototype.slice.call(stage.querySelectorAll('.hcard'));
    cardCenters=cardEls.map(function(c){ return c.offsetLeft + c.offsetWidth/2; });
  }
  function updateActive(){
    var stage=getStage();
    if(!stage) return;
    var max=stage.scrollWidth-stage.clientWidth;
    var p=max>0?stage.scrollLeft/max:0;
    setDialHandle(p);
    var mid=stage.scrollLeft+stage.clientWidth/2, best=null, bestD=1e9;
    for(var i=0;i<cardCenters.length;i++){
      var d=Math.abs(cardCenters[i]-mid);
      if(d<bestD){ bestD=d; best=cardEls[i]; }
    }
    var pinned = stage.querySelector('.hcard.active');
    var target = pinned || best;
    if(target) fillBody(target);
    var readout=document.getElementById('dialReadout');
    if(readout && target){
      var idx=+target.dataset.idx, t=(DATA[idx]&&DATA[idx].time)||'—';
      readout.textContent='REC '+(idx+1).toString().padStart(3,'0')+' / '+DATA.length+'   '+t;
    }
  }
  function bindStage(){
    var stage=getStage(); if(!stage) return;
    cacheCards();
    stage.addEventListener('scroll', updateActive, {passive:true});
    stage.addEventListener('wheel', function(e){
      var horizontal = Math.abs(e.deltaX) > Math.abs(e.deltaY) || e.shiftKey;
      if(!horizontal) return;
      var max = stage.scrollWidth - stage.clientWidth;
      if(max <= 0) return;
      e.preventDefault();
      stage.scrollLeft += (e.deltaX || e.deltaY);
    }, {passive:false});
    bindDialDrag();
  }
  /* 底部实心圆盘：航海罗盘式「抓盘即转」→ 胶片行左右滚动（180°转满=走完全部 + 松手惯性滑行） */
  function bindDialDrag(){
    var wrap=document.querySelector('.dial-wrap');
    var stage=getStage();
    if(!wrap||!stage) return;
    var svg=wrap.querySelector('.dial');
    var dragging=false, raf=0, vel=0, pivot={x:0,y:0};
    var grabOffset=0, contAng=0;
    function pivotOf(){
      var r=svg.getBoundingClientRect();
      var scale=Math.min(r.width/1000, r.height/200);
      var cw=1000*scale, ch=200*scale, offY=(r.height-ch);
      return { x:r.left+(r.width-cw)/2+500*scale, y:r.top+offY+195*scale };
    }
    // 数学角：盘心为原点、向上为正，与 setDialHandle 的 th 同坐标系（全角连续，无下半圆死区）
    function pointerAngle(e){ return Math.atan2(pivot.y - e.clientY, e.clientX - pivot.x); }
    function stopInertia(){ if(raf){ cancelAnimationFrame(raf); raf=0; } }
    function setScroll(p){
      p=Math.max(0,Math.min(1,p));
      var max=stage.scrollWidth-stage.clientWidth;
      if(max>0) stage.scrollLeft=p*max;
      setDialHandle(p);
    }
    function inertia(){
      if(!dragging && Math.abs(vel)>0.00015){
        var max=stage.scrollWidth-stage.clientWidth;
        var p=max>0?stage.scrollLeft/max:0;
        var np=p+vel;
        if(np<=0||np>=1){ np=Math.max(0,Math.min(1,np)); vel=0; }
        setScroll(np); vel*=0.94;
        raf=requestAnimationFrame(inertia);
      } else { raf=0; vel=0; }
    }
    /* V29D · 命中判定收紧：只认「以盘心为圆心、半径 185±34」的环带，且不得落到盘心水平线以下，
       这样 REC 读数与底部提示文字区域彻底不再触发拖拽，避免误触 */
    function hitRing(e){
      var r=svg.getBoundingClientRect();
      var scale=Math.min(r.width/1000, r.height/200);
      if(!scale) return false;
      var pv=pivotOf();
      var dx=(e.clientX-pv.x)/scale, dy=(e.clientY-pv.y)/scale;
      if(dy > 24) return false;                 // 盘心水平线以下（读数 / 提示区）不响应
      var dist=Math.sqrt(dx*dx+dy*dy);
      return Math.abs(dist-185) <= 34;          // 环体半径 185：容差覆盖 28px 描边 + 14px 手柄
    }
    wrap.addEventListener('pointerdown', function(e){
      if(e.button!==undefined && e.button!==0) return;
      if(!hitRing(e)) return;                   // 环带外：直接放过，不进入拖拽
      stopInertia(); dragging=true;
      pivot=pivotOf();
      var max=stage.scrollWidth-stage.clientWidth;
      var p=max>0?stage.scrollLeft/max:0;
      var handleAng=Math.PI - p*Math.PI;   // 当前手柄所在角度
      contAng=pointerAngle(e);
      grabOffset=handleAng - contAng;       // 抓住点相对手柄的角度差，保证手柄贴合手指
      wrap.classList.add('dragging');
      if(wrap.setPointerCapture){ try{ wrap.setPointerCapture(e.pointerId); }catch(_){} }
      e.preventDefault();
    });
    wrap.addEventListener('pointermove', function(e){
      if(!dragging) return;
      var max=stage.scrollWidth-stage.clientWidth;
      if(max<=0) return;
      var a=pointerAngle(e), da=a-contAng;
      while(da>Math.PI) da-=2*Math.PI;
      while(da<-Math.PI) da+=2*Math.PI;
      contAng+=da;                          // 连续累计角度，跨底不跳变、无死区
      var handleAng=contAng+grabOffset;
      if(handleAng<0) handleAng=0; else if(handleAng>Math.PI) handleAng=Math.PI;
      var p=1-handleAng/Math.PI;            // 左端(π)→右端(0) ≡ 180°转满
      var prevP=stage.scrollLeft/max;
      setScroll(p);
      vel=p-prevP;                          // 当前帧速度，供松手惯性
      if(vel>0.06) vel=0.06; else if(vel<-0.06) vel=-0.06;
    });
    function end(){
      if(!dragging) return;
      dragging=false; wrap.classList.remove('dragging');
      raf=requestAnimationFrame(inertia);   // 松手后按当前速度惯性滑行
    }
    wrap.addEventListener('pointerup', end);
    wrap.addEventListener('pointercancel', end);
  }
  function setWatermark(g){ var t = g ? g : 'ALL'; document.body.style.setProperty('--wm', '"'+t+'"'); }
  document.querySelectorAll('.rail-item[data-sec]').forEach(function(r){
    r.addEventListener('click',function(e){
      e.preventDefault(); var g=r.dataset.sec;
      window.__curGame=(window.__curGame===g)?'':g;
      if(typeof game!=='undefined'){ game=window.__curGame; }
      document.querySelectorAll('.rail-item[data-sec]').forEach(function(x){ x.classList.toggle('active', x.dataset.sec===window.__curGame && window.__curGame!==''); });
      setWatermark(window.__curGame);
      if(typeof render==='function'){ render(); }
    });
  });
  var railAllBtn=document.getElementById('railAll');
  if(railAllBtn){ railAllBtn.addEventListener('click',function(){
    game=''; if(typeof window.__curGame!=='undefined'){ window.__curGame=''; }
    document.querySelectorAll('.rail-item[data-sec]').forEach(function(x){ x.classList.remove('active'); });
    setWatermark('');
    if(typeof render==='function'){ render(); }
  }); }
  var toggleAllBtn=document.getElementById('toggleAll');
  if(toggleAllBtn){ toggleAllBtn.addEventListener('click',function(){
    var open=document.querySelectorAll('.hcard.active');
    if(open.length){ open.forEach(function(e){ e.classList.remove('active'); }); document.body.classList.remove('film-open'); }
    else { var f=document.querySelector('.hcard'); if(f) activate(f); }
  }); }
  // 同步初始化：data.js 已注入 window.DATA，此处 bindStage/updateActive 在同一 IIFE 作用域内
  window.DATA = window.DATA || [];
  setWatermark(game||'');
  if(typeof render==='function'){
    var _o=render;
    // 打开页面 / 切换分类时均不自动展开任何胶片（保持全部关闭）
    render=function(){_o();bindStage();updateActive();refitSoon();};
    render();
    refit();   // 首次同步定档，避免先按 fit=1 画一帧再跳到缩放态
  }
})();
</script>
